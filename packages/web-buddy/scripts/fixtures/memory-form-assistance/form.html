<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Memory assistance fixture</title></head>
<body>
  <main>
    <h1>Preferences</h1>
    <label for="city">City</label>
    <input id="city" name="city" type="text" required>

    <label for="language">Language</label>
    <select id="language" name="language" required>
      <option value="">Choose</option>
      <option value="English">English</option>
      <option value="Chinese">Chinese</option>
      <option value="Japanese">Japanese</option>
    </select>

    <fieldset><legend>Work mode</legend>
      <label><input name="workMode" type="radio" value="Remote" required>Remote</label>
      <label><input name="workMode" type="radio" value="Hybrid">Hybrid</label>
      <label><input name="workMode" type="radio" value="Office">Office</label>
    </fieldset>

    <label for="timezone">Timezone</label>
    <input id="timezone" name="timezone" type="text" required>

    <fieldset><legend>Notification channel</legend>
      <label><input name="notificationChannel" type="radio" value="Email" required>Email</label>
      <label><input name="notificationChannel" type="radio" value="SMS">SMS</label>
      <label><input name="notificationChannel" type="radio" value="Lark">Lark</label>
    </fieldset>
  </main>
</body>
</html>
